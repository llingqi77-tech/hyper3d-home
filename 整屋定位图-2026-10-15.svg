<rect x="840" y="190" width="626" height="220" rx="20" fill="#e4eeeb"/>
<text x="868" y="232" class="label">先固定位置，再拼家具</text>
<text x="868" y="272" class="note">入口 → 餐厅 / 厨房 → 客厅与中央过道</text>
<text x="868" y="306" class="note">过道 → 两卫、客房、儿童房、主卧</text>
<text x="868" y="345" class="note">旧房间的“左右 / 东南”先视作局部方向。</text>
<text x="868" y="378" class="note">整间旋转对门洞；不直接镜像翻转家具。</text>
<rect x="840" y="430" width="626" height="328" rx="20" fill="#fff" stroke="#dce4e2"/>
<text x="868" y="475" class="label">尺寸状态</text>
<text x="868" y="516" class="note">明确标注：客房 2.94 × 3.30；儿童房纵向 3.63。</text>
<text x="868" y="554" class="note">分段推导：儿童房横向 1.27 + 1.60 + 0.79。</text>
<text x="868" y="592" class="note">待核：公卫 1 总宽、公卫 2 凹形、主卧纵深。</text>
<text x="868" y="630" class="note">待核：厨房凹口、餐厅入口区、完整过道净宽。</text>
<text x="868" y="677" class="note">统一净高预案 2.72 m；墙厚预案 0.14 m。</text>
<text x="868" y="714" class="note" style="fill:#a06531">高度、墙厚和家具尺寸均为模型预案，非实测。</text>
<rect x="840" y="778" width="626" height="340" rx="20" fill="#fff" stroke="#dce4e2"/>
<text x="868" y="823" class="label">待补物件重点</text>
<text x="868" y="866" class="note">厨房：物件均已有模型；12 类尚未接入当前页。</text>
<text x="868" y="905" class="note">公卫 1：龙头、镜、窗、架、用品与门等 9 组。</text>
<text x="868" y="944" class="note">公卫 2：23 类已接入；重校房壳和设备间距。</text>
<text x="868" y="983" class="note">餐客厅：桌体、主要客厅家具需独立化 / 核对。</text>
<text x="868" y="1022" class="note">客房：床柜桌窗等结构件需核对与尺寸适配。</text>
<text x="868" y="1061" class="note">主卧、儿童房：独立网页和详细物件清单待建。</text>
<rect x="840" y="1138" width="626" height="197" rx="20" fill="#f3ecdf"/>
<text x="868" y="1182" class="label">本次不直接挪动已完成网页</text>
<text x="868" y="1224" class="note">先确认房间门洞和尺寸冲突，再进行整屋装配。</text>
<text x="868" y="1262" class="note">当前餐客厅面积曾放大 2 倍，整合时须恢复比例。</text>
<text x="868" y="1300" class="note">物件详细列表及宽 × 深 × 高见配套 Markdown。</text>
<text x="56" y="1374" class="sub">图例：浅色房间 = 已有网页；斜纹 = 待建；蓝线 = 窗位置；绿色虚线 = 门洞连接意向。</text>
<text x="56" y="1410" class="sub">公卫 2 门位已按原图圆弧修正，橙线为门扇及开启弧；精确墙厚未展开。标注跨度不等于统一测绘净尺寸。</text>
