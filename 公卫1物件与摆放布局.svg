<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">公卫 1 物件与摆放布局（按确认位置修正）</title>
  <desc id="desc">入口在东南角；柜子和马桶位于西侧，淋浴头位于东侧墙，唯一镜子在洗手台上方，百叶窗在马桶上方北墙。</desc>
  <defs><style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#202a32}.small{font-size:14px}.label{font-size:17px;font-weight:600}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#53616b}
    .room{fill:#e5e8e5;stroke:#26343c;stroke-width:5}.tile{fill:#284b52;stroke:#203d44;stroke-width:2}.vanity{fill:#c5a84c;stroke:#665321;stroke-width:2}.fixture{fill:#f9f6ed;stroke:#69777a;stroke-width:2}.metal{fill:none;stroke:#2b3031;stroke-width:5}.warm{fill:#f7df9a;stroke:#96794a;stroke-width:2}.guide{stroke:#78858c;stroke-width:1.5;stroke-dasharray:7 6}
  </style></defs>
  <rect width="1200" height="760" fill="#f4f6f5"/>
  <text x="48" y="52" class="title">公卫 1 物件与摆放布局</text>
  <text x="49" y="80" class="sub">依据公卫照片与已确认布局｜房间约 142 × 170 cm｜东南入口</text>
  <text x="230" y="116" class="label">北｜马桶后侧</text>
  <rect x="150" y="130" width="390" height="465" rx="2" class="room"/>
  <!-- Deep blue-gray lower wall tile band shown as an inner perimeter. -->
  <path d="M159 139H531V586H159Z" fill="none" stroke="#284b52" stroke-width="14"/>
  <!-- Vanity on the left after entering from the southeast. -->
  <rect x="162" y="355" width="91" height="184" rx="3" class="vanity"/>
  <path d="M166 366h83M166 400h83M166 434h83M166 468h83M166 502h83" stroke="#e1d5a8" stroke-width="3" stroke-dasharray="6 5"/>
  <ellipse cx="207" cy="383" rx="34" ry="24" fill="#f5f5ef" stroke="#758184" stroke-width="3"/>
  <path d="M199 354v-18q0-15 12-15t12 15v9" fill="none" stroke="#98713c" stroke-width="5"/>
  <rect x="231" y="360" width="13" height="24" rx="5" fill="#7c99a0" stroke="#4b6469" stroke-width="2"/>
  <text x="157" y="557" class="small">02 格栅柜 / 03 台上盆</text><text x="163" y="579" class="small">04 龙头 / 13 洗手液</text>
  <!-- Mirror and double stained-glass lamps on the west wall above basin. -->
  <rect x="162" y="217" width="18" height="108" rx="5" fill="#303536"/>
  <path d="M164 228q-18 12 0 22q18 12 0 22q-18 12 0 22q18 12 0 22" fill="none" stroke="#202626" stroke-width="4"/>
  <circle cx="201" cy="239" r="16" class="warm"/><circle cx="238" cy="239" r="16" class="warm"/>
  <path d="M194 254v10m37-10v10" stroke="#725a37" stroke-width="4"/>
  <text x="182" y="196" class="small">06 双头壁灯</text><text x="183" y="280" class="small">05 铁艺镜</text>
  <!-- Towel rail on upper west wall. -->
  <path d="M188 162h94m-81 0v25m68-25v25" class="metal"/>
  <path d="M216 187v54q10 12 20 0v-54" fill="#ead4a2" stroke="#9c8b67" stroke-width="2"/>
  <text x="292" y="174" class="small">08 毛巾架与挂巾</text>
  <!-- Toilet faces east toward the showerhead mounted on the east wall. -->
  <rect x="169" y="220" width="48" height="58" rx="10" class="fixture"/>
  <rect x="178" y="229" width="30" height="40" rx="7" fill="#eceee9" stroke="#899395" stroke-width="2"/>
  <path d="M216 222q35-9 60 8q19 13 19 36t-19 36q-25 17-60 8" fill="#faf9f4" stroke="#899395" stroke-width="3"/>
  <ellipse cx="258" cy="266" rx="25" ry="31" fill="none" stroke="#adb5b3" stroke-width="3"/>
  <text x="169" y="329" class="small">07 马桶（朝东）</text><text x="169" y="350" class="small">10 纸巾盒近水箱</text>
  <!-- Wall-mounted shower arm and head on the east wall, aimed west at the toilet. -->
  <path d="M536 176h-35v23" fill="none" stroke="#59696d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M490 199h23m-19 7 4-7-4-7m10 14 4-7-4-7m10 14 4-7-4-7" fill="none" stroke="#59696d" stroke-width="3"/>
  <path d="M536 176h-35" stroke="#59696d" stroke-width="8" stroke-linecap="round"/>
  <path d="M477 224H306m7-7-7 7 7 7" fill="none" stroke="#a87538" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="405" y="248" class="small">15 东墙淋浴头</text>
  <!-- Rack above the toilet; east window and floor drain. -->
  <path d="M290 163h82m-82 27h82m-75-27v27m68-27v27" fill="none" stroke="#59696d" stroke-width="4"/>
  <circle cx="312" cy="172" r="6" fill="#fff" stroke="#59696d" stroke-width="2"/><circle cx="337" cy="172" r="6" fill="#fff" stroke="#59696d" stroke-width="2"/>
  <text x="286" y="211" class="small">09 马桶上方置物架</text>
  <rect x="365" y="142" width="122" height="47" fill="#11191d" stroke="#59696d" stroke-width="4"/>
  <path d="M370 151h112m-112 9h112m-112 9h112m-112 9h112" stroke="#879499" stroke-width="3"/>
  <text x="391" y="211" class="small">11 北墙百叶窗</text>
  <rect x="500" y="535" width="21" height="21" fill="#455458" stroke="#1d282b" stroke-width="2"/><path d="M504 539l13 13m0-13-13 13" stroke="#b7c3c3" stroke-width="2"/>
  <text x="424" y="574" class="small">12 地漏</text>
  <!-- 64 cm doorway at the southeast corner; the door swings inward along the east wall. -->
  <rect x="364" y="586" width="176" height="18" fill="#e5e8e5"/>
  <path d="M540 595v-176m0 176a176 176 0 0 0-176-176" fill="none" stroke="#26343c" stroke-width="3"/>
  <path d="M455 648v-30m-7 8 7-8 7 8" fill="none" stroke="#26343c" stroke-width="3"/><text x="420" y="638" class="label">14 东南入口</text>
  <text x="299" y="365" class="label">01 深色地砖</text><text x="296" y="393" class="sub">上墙浅色斜铺砖 / 下墙深色砖</text>

  <rect x="625" y="132" width="530" height="496" rx="14" fill="#fff" stroke="#d2d9d8" stroke-width="2"/>
  <text x="660" y="174" class="label">照片中可确认</text>
  <text x="660" y="215" class="small">• 入口在东南角，门向内开</text>
  <text x="660" y="250" class="small">• 浴室柜与马桶在西侧，进门后位于左手边</text>
  <text x="660" y="285" class="small">• 镜框和双头壁灯在柜子上方</text>
  <text x="660" y="320" class="small">• 马桶坐姿朝东，正对东侧墙面的淋浴头</text>
  <text x="660" y="355" class="small">• 百叶窗在马桶上方北墙，镜子在柜子上方</text>
  <text x="660" y="375" class="label">尺寸与方向依据</text>
  <text x="660" y="410" class="small">• 户型图标注约 142 × 170 cm；布局方向按用户草图</text>
  <text x="660" y="445" class="small">• 位置按用户提供的草图和实拍照片修正</text>
  <text x="660" y="480" class="small">• 设备尺寸按照片比例估算，不作施工尺寸</text>
  <text x="660" y="535" class="label">按最新指示修正</text>
  <text x="660" y="570" class="small">请核对门、窗、台盆柜和马桶的相对位置。</text>
  <text x="48" y="738" class="sub">公卫 1 布局记录｜柜子与台盆使用单独提取的参考图重新生成</text>
</svg>
