<rect x="242" y="390" width="182" height="58" rx="5" fill="#f5f2e9" stroke="#9b9b8b"/>
<text x="333" y="414" text-anchor="middle" class="label">左侧整墙书柜</text>
<text x="333" y="434" text-anchor="middle" class="small">门扇净空之后铺至窗墙</text>
