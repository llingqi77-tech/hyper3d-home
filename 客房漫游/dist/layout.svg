<text x="708" y="644" text-anchor="middle" class="small">床架与竹席同步拓宽至标注线</text>
<!-- doorway and full-height leaf swings along left wall -->
<rect x="124" y="587" width="14" height="260" fill="#fffdf8"/>
<path d="M130 858A260 260 0 0 1 390 598" fill="none" stroke="#aa9a75" stroke-width="3" stroke-dasharray="9 7"/>
<path d="M130 858V598" stroke="#e8dfca" stroke-width="13" stroke-linecap="round"/>
<circle cx="130" cy="858" r="8" fill="#9a815b"/>
<rect x="245" y="734" width="130" height="47" rx="20" fill="#59684e"/>
<text x="310" y="764" text-anchor="middle" fill="#fff" class="label" style="fill:#fff">全高入口门</text>
<text x="130" y="888" class="small">门净宽约 1.14 米* · 门扇向内打开后沿左墙收起</text>
<path d="M130 931H890" stroke="#9a9d91" stroke-width="1"/>
<text x="130" y="957" class="small">四面墙顶线统一，入口门从地面到墙顶；不设屋顶以便查看室内</text>
<!-- inventory panel -->
<rect x="939" y="151" width="678" height="822" rx="8" fill="#fffdf8" stroke="#d8d6cb"/>
<text x="973" y="194" class="subhead">物品清单</text>
<text x="1582" y="194" text-anchor="end" class="small">共 18 项 · 11 件独立 Hyper3D 模型</text>
<g class="item">
<g transform="translate(973 228)"><text y="0" class="item">01　白色整墙书柜 × 1</text><text y="20" class="small">奶油白开放格，左墙门扇净空后至窗墙*</text></g>
<g transform="translate(973 274)"><text y="0" class="item">02　窗帘 × 1 套</text><text y="20" class="small">灰蓝上帘、米色格纹下帘、金色滚边</text></g>
<g transform="translate(973 320)"><text y="0" class="item">03　窗户 × 1</text><text y="20" class="small">深色窗框、浅蓝灰玻璃</text></g>
<g transform="translate(973 366)"><text y="0" class="item">04　定制书桌 × 1 组</text><text y="20" class="small">奶油白台面与抽屉、圆形金属拉手</text></g>
<g transform="translate(973 412)"><text y="0" class="item">05　显示器 × 1　　06　键盘 × 1</text><text y="20" class="small">黑色独立设备，置于桌面与键盘托</text></g>
<g transform="translate(973 458)"><text y="0" class="item">07　桌面笔筒 × 1</text><text y="20" class="small">亮绿镂空笔筒，带彩色文具</text></g>
<g transform="translate(973 504)"><text y="0" class="item">08　书刊 × 1 组　　09　木椅 × 1</text><text y="20" class="small">米色浅棕纸面；黑色木框与棕色座面</text></g>
<g transform="translate(973 550)"><text y="0" class="item">10　连体收纳低柜 × 1 组</text><text y="20" class="small">奶油白抽屉与双开门、金属圆拉手</text></g>
<g transform="translate(973 596)"><text y="0" class="item">11　阶梯开放置物架 × 1 组</text><text y="20" class="small">奶油白三格，置于低柜台面</text></g>
<g transform="translate(973 642)"><text y="0" class="item">12　加宽床架 × 1　　13　竹席 × 1</text><text y="20" class="small">奶油白框架、蜂蜜金棕色席面</text></g>
<g transform="translate(973 688)"><text y="0" class="item">14　粉色花卉被褥 × 1 组</text><text y="20" class="small">粉色底、玫红花卉纹，床头叠放</text></g>
<g transform="translate(973 734)"><text y="0" class="item">15　红粉图案枕头 × 1</text><text y="20" class="small">棉布纹理，置于床头</text></g>
<g transform="translate(973 780)"><text y="0" class="item">16　三头吊灯 × 1</text><text y="20" class="small">鼠尾草绿布罩、古铜色灯臂</text></g>
<g transform="translate(973 826)"><text y="0" class="item">17　桌面台扇 × 1</text><text y="20" class="small">米白网罩与红粉扇叶</text></g>
<g transform="translate(973 872)"><text y="0" class="item">18　绿植 × 2 盆</text><text y="20" class="small">高挑绿植与黄盆仙人球</text></g>
</g>
<text x="973" y="933" class="small">* 展示估算值。房间边长、门高及书柜尺寸需现场复尺。</text>
