<rect x="140" y="233" width="82" height="340" rx="3" fill="#f2ebdc" stroke="#6f7168" stroke-width="3"/>
<path d="M145 240h72M145 318h72M145 396h72M145 474h72M145 552h72" stroke="#b7ad98" stroke-width="5"/>
