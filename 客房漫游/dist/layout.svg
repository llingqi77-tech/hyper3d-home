<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
<title id="title">客房物品布局与物品清单修订稿</title><desc id="desc">下侧靠左是与四面墙等高的入口门。门打开后沿左墙收起，左侧书柜填满门扇净空以外直至窗墙的整段墙面。窗下是书桌，右侧是加宽床。</desc>
<defs>
 <pattern id="floor" width="140" height="58" patternUnits="userSpaceOnUse"><rect width="140" height="58" fill="#7f4834"/><path d="M0 1H140M0 29H140M68 0V29M120 29V58" stroke="#542f28" stroke-width="2"/><path d="M8 9c27-6 50 7 82 0m-78 9c18-3 37 4 57 0m40 20c10-3 20 3 28 0" fill="none" stroke="#a76945" stroke-opacity=".25"/></pattern>
 <pattern id="bamboo" width="17" height="17" patternUnits="userSpaceOnUse"><rect width="17" height="17" fill="#c29451"/><path d="M2 0v17m4-17v17m6-17v17M0 8h17" stroke="#906832" stroke-opacity=".55" stroke-width="1"/></pattern>
 <pattern id="plaid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e4dac7"/><path d="M4 0v16M12 0v16M0 4h16M0 12h16" stroke="#b5a68e" stroke-width="1"/></pattern>
 <style>
 text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#354035}.title{font-family:"Songti SC","STSong",serif;font-size:43px;letter-spacing:4px}.small{font-size:13px;fill:#818778}.label{font-size:14px}.item{font-size:13px}.number{font-size:12px;font-weight:700;fill:#fff}.subhead{font-size:14px;letter-spacing:2px;fill:#738064}
 </style>
</defs>
<rect width="1680" height="1120" fill="#f3f0e9"/>
