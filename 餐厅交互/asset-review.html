<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#d8d2c8;font:14px sans-serif}#grid{display:grid;grid-template-columns:repeat(3,1fr)}section{height:330px;position:relative}b{position:absolute;top:12px;left:16px}canvas{position:fixed;inset:0;pointer-events:none}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script><div id="grid"></div><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OBJLoader}from'three/addons/loaders/OBJLoader.js';
const names=['温莎椅_单体.glb','餐边柜_已核对.glb','餐边柜_资产库.glb','table_base.obj','鞋柜凳.glb','餐厅油画.glb','餐厅窗户.glb','餐厅挂钟.glb','餐厅吊扇.glb'];
const r=new T.WebGLRenderer({antialias:true,alpha:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(1);document.body.append(r.domElement);r.setScissorTest(true);const views=[];
for(const name of names){const el=document.createElement('section');el.innerHTML='<b>'+name+'</b>';document.querySelector('#grid').append(el);const s=new T.Scene();s.background=new T.Color('#d8d2c8');s.add(new T.HemisphereLight(0xffffff,0x837466,2.6));const l=new T.DirectionalLight(0xffffff,2);l.position.set(3,5,6);s.add(l);const c=new T.PerspectiveCamera(38,1,.01,100);c.position.set(2.4,1.7,4);c.lookAt(0,.8,0);views.push({el,s,c});(name.endsWith('.obj')?new OBJLoader():new GLTFLoader()).load('assets/'+name,g=>{const o=g.scene||g;if(name.endsWith('.obj')){const t=new T.TextureLoader().load('assets/table_texture_diffuse.png');t.colorSpace=T.SRGBColorSpace;o.traverse(m=>{if(m.isMesh)m.material=new T.MeshStandardMaterial({map:t})})}const b=new T.Box3().setFromObject(o),sz=b.getSize(new T.Vector3());o.scale.setScalar(2/Math.max(sz.x,sz.y,sz.z));b.setFromObject(o);const p=b.getCenter(new T.Vector3());o.position.set(-p.x,-b.min.y,-p.z);s.add(o)});}
r.setAnimationLoop(()=>{for(const v of views){const b=v.el.getBoundingClientRect();if(b.bottom<0||b.top>innerHeight)continue;r.setViewport(b.left,innerHeight-b.bottom,b.width,b.height);r.setScissor(b.left,innerHeight-b.bottom,b.width,b.height);v.c.aspect=b.width/b.height;v.c.updateProjectionMatrix();r.render(v.s,v.c)}});
</script></html>
